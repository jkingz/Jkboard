name: CI

# The gate steps are the same chain as docs/project-context.md → Verification
# gates, in that order. One list, no drift.
#
# Two deliberate deviations, both named rather than hidden:
#
#   1. `pnpm test:unit`, not `pnpm test`. The integration tier needs a real
#      DATABASE_URL; adding a repository secret to this job for a read-only
#      schema assertion would let a fork and a first clone fail for a reason
#      that is not a defect. The gap is recorded in docs/project-context.md →
#      Verification gates and must stay there until the tier is credential-free.
#
# Keep the build hermetic. Anything fetched over the network at build time fails
# on a sealed runner. It was true of `next/font/google` and is now fixed by
# vendoring Inter into src/lib/fonts/. Prove it after any font or asset change:
#
#   rm -rf .next && NODE_USE_ENV_PROXY=1 HTTPS_PROXY=http://127.0.0.1:9 pnpm build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: typecheck / lint / test / build
    # Pinned, not `ubuntu-latest`. That label rolls from Ubuntu 24.04.5 to
    # 26.04.1 over the weeks beginning 2026-10-19, completing 2026-11-19
    # (actions/runner-images#14748). The network-sensitive step here is
    # `pnpm install --frozen-lockfile`, which runs postinstall for esbuild and
    # unrs-resolver — prebuilt platform binaries are exactly what a base-image
    # jump breaks, and it would break on someone else's push, for a reason no
    # one chose. Move up deliberately, on a run that can afford to fail.
    runs-on: ubuntu-24.04
    env:
      # Non-secret placeholders. The build prerenders and only needs these
      # present; (dashboard) is force-dynamic so nothing connects at build time.
      DATABASE_URL: postgresql://USER:PASSWORD@HOST/neondb?sslmode=require
      BETTER_AUTH_SECRET: ci-placeholder-not-a-secret
      BETTER_AUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.3

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - name: Install
        # esbuild and unrs-resolver need their postinstall; they are allowed by
        # pnpm.onlyBuiltDependencies in package.json, so --frozen-lockfile is
        # enough.
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test (unit tier)
        run: pnpm test:unit

      - name: Build
        run: pnpm build